name: 'Common Setup'
description: 'Sets up the environment for building the project'

inputs:
  ssh-private-key:
    description: 'SSH private key for authentication'
    required: true
  llvm-version:
    description: 'clang version to install'
    default: "19.1.1"
    required: false
  vulkan-version:
    description: 'Vulkan SDK version to install'
    default: 1.3.296.0
    required: false
  ninja-version:
    description: 'Ninja version to install'
    default: 1.12.1
    required: false
  poetry-version:
    description: 'poetry version to install'
    default: 2.1.3
    required: false

runs:
  using: "composite"
  steps:
    - name: SSH Agent
      uses: webfactory/ssh-agent@v0.5.4
      with:
        ssh-private-key: ${{ inputs.ssh-private-key }}

    - name: Pull Git LFS resources
      shell: bash
      run: |
        git lfs install 
        git lfs pull

    - name: Install Ninja
      uses: ashutoshvarma/setup-ninja@master
      with:
        version: ${{ inputs.ninja-version }}

    - name: Add ninja_bin to PATH
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Get the full path to ninja_bin in your workspace
        $ninja_bin_path = Join-Path $env:GITHUB_WORKSPACE "ninja_bin"
        
        # Verify the directory exists
        if (Test-Path $ninja_bin_path) {
          Write-Output "Found ninja_bin at: $ninja_bin_path"
        } else {
          Write-Error "ninja_bin directory not found at: $ninja_bin_path"
          exit 1
        }
        
        # Add to PATH for current step
        $env:PATH = "$ninja_bin_path;$env:PATH"
        
        # Add to PATH for subsequent steps in this job
        echo "$ninja_bin_path" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        
        # Verify the updated PATH
        Write-Output "Updated PATH: $env:PATH"
        
        # Try to find ninja in the PATH
        $ninja_location = Get-Command ninja -ErrorAction SilentlyContinue
        if ($ninja_location) {
          Write-Output "Ninja found at: $($ninja_location.Source)"
        } else {
          Write-Output "Ninja executable not found in PATH"
        }

    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@v2.0.7
      with:
        version: ${{ inputs.llvm-version }}
        env: true

    - name: Install and configure Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ inputs.poetry-version }}

    - name: Poetry setup
      shell: bash
      run: |
        poetry install --no-root
        poetry env use python
        poetry env activate

    - name: Add Poetry to PATH
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $poetry_path = "C:\Users\runneradmin\.local\bin"
        
        # Add to PATH for current step
        $env:PATH = "$poetry_path;$env:PATH"
        
        # Add to PATH for subsequent steps
        echo "$poetry_path" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        
        Write-Output "Added Poetry to PATH: $poetry_path"

    - name: Configure conan remote
      shell: bash
      run: poetry run conan remote update conancenter --url https://center2.conan.io

    - name: Check conan cache
      id: cache-conan
      uses: actions/cache@v4
      with:
        path: |
          ~/.conan2
          ~/.conan
        key: ${{ runner.os }}-conan-cache

    - name: Prepare Vulkan SDK
      uses: humbletim/install-vulkan-sdk@v1.2
      with:
        version: ${{ inputs.vulkan-version }}
        cache: true